<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <title>CUPLE — Зв'язок на відстані</title>
    <style>
        /* Основний фон сайту — глибокий темний, як у додатку */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            background-color: #121212; 
            color: #FFFFFF;
            padding: 50px 20px; 
            margin: 0;
        }
        
        /* Картка додатка */
        .container { 
            max-width: 450px; 
            margin: 0 auto; 
            background: #1A1A1A; 
            padding: 40px 30px; 
            border-radius: 24px; /* М'які закруглення кутів */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid #2A2A2A;
        }
        
        /* Логотип CUPLE */
        h1 { 
            color: #FF8C00; /* Фірмовий помаранчевий колір */
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        /* Підзаголовок */
        p { 
            color: #A0A0A0; 
            font-size: 16px; 
            line-height: 1.5;
            margin-bottom: 35px;
        }
        
        /* Стильна кнопка завантаження */
        .btn-download { 
            display: inline-block; 
            background-color: #FF8C00; 
            color: #121212; 
            padding: 16px 40px; 
            font-size: 18px; 
            font-weight: bold; 
            text-decoration: none; 
            border-radius: 50px; /* Овальна кнопка, схожа на елементи інтерфейсу */
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
        }
        
        /* Ефект при наведенні курсора */
        .btn-download:hover { 
            background-color: #FFA500; 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.5);
        }

        /* Додаткова інформація про версію */
        .version-info {
            margin-top: 25px;
            font-size: 13px;
            color: #555555;
        }
    </style>
</head>

<div class="container">
    <h1>CUPLE</h1>
    <p>Натисніть кнопку нижче, щоб завантажити офіційний інсталяційний файл програми для Android та керувати вашим нічником.</p>
